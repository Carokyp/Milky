{% extends 'base.html' %}
{% load static %}

{% block extra_title %}Edit Product - Milky{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12">

            <!-- Page title -->
            <header class="d-flex align-items-center gap-3 mb-4">
                <a href="{% url 'all_products' %}" class="back-btn" aria-label="Back to all products">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <h1 class="logo-font text-h2 text-uppercase mb-0">Edit Product</h1>
            </header>

            <form method="POST" enctype="multipart/form-data" action="{% url 'edit_product' product.id %}" class="product-form">
                {% csrf_token %}
                {% include "products/_product-form-fields.html" with submit_label="Update Product" show_url_divider=True %}
            </form>

        </div>
    </div>
</div>
{% endblock %}
