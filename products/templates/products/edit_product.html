{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block extra_title %}Edit Product - Milky{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <h2 class="fw-bold text-uppercase mb-1">Edit Product</h2>
            <p class="text-muted small mb-4">Editing: <strong>{{ product.name }}</strong></p>

            <form method="POST" enctype="multipart/form-data" action="{% url 'edit_product' product.id %}">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="text-center mt-4">
                    <button type="submit" class="btn-milky btn rounded-pill px-4 py-2 mb-2">
                        Update Product
                    </button>
                    <a href="{% url 'all_products' %}" class="btn-milky btn rounded-pill px-4 py-2">
                        Cancel
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
