{% if widget.is_initial %}
<p>{{ widget.initial_text }}:</p>
<a href="{{ widget.value.url }}">
    <img width="96" height="96" src="{{ widget.value.url }}" alt="product image">
</a>
{% if not widget.required %}
<div class="form-check mt-2">
    <input class="form-check-input" type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}">
    <label class="form-check-label" for="{{ widget.checkbox_id }}">
        {{ widget.clear_checkbox_label }}
    </label>
</div>
{% endif %}
<br>
{% endif %}

<button type="button"
        class="btn btn-milky rounded-pill px-3 py-2"
        onclick="document.getElementById('{{ widget.attrs.id }}').click()">
    {{ widget.input_text }} Select Image
</button>

<input id="{{ widget.attrs.id }}"
       type="{{ widget.type }}"
       name="{{ widget.name }}"
       style="display: none;">
<p id="filename" class="small mt-1"></p>
