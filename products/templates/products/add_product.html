{% extends 'base.html' %}
{% load static %}

{% block extra_title %}Add Product - Milky{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12">

            <!-- Page title -->
            <header class="mb-4">
                <h1 class="logo-font text-h2 text-uppercase mb-0">Add Product</h1>
            </header>

            <form method="POST" enctype="multipart/form-data" class="product-form">
                {% csrf_token %}
                {% include "products/_product-form-fields.html" with submit_label="Add Product" show_url_divider=False %}
            </form>

        </div>
    </div>
</div>
{% endblock %}
