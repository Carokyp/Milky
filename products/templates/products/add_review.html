{% load static %}

<form method="POST" action="{% url 'add_review' product.id %}" id="review-form">
    {% csrf_token %}

    <!-- Star rating selector -->
    <div class="mb-3">
        <p class="form-label fw-bold rating mb-1" id="rating-label">Rating</p>
        <div class="d-flex gap-1 fs-4" role="radiogroup" aria-labelledby="rating-label">
            {% for i in "12345" %}
            <i class="fa-regular fa-star star star-btn"
               data-value="{{ forloop.counter }}"></i>
            {% endfor %}
        </div>
        <input type="hidden" name="rating" id="rating-input" value="1" required>
    </div>

    <div class="mb-3">
        <label for="id_comment" class="visually-hidden">Your review</label>
        <textarea name="comment" id="id_comment" class="form-control" rows="4"
            placeholder="Share your thoughts about this product..."></textarea>
    </div>

    <div class="text-center mt-3">
        <button type="submit" class="btn-milky-gold btn rounded-pill px-5 py-2 fw-bold text-uppercase">
            Submit Review
        </button>
    </div>
</form>

<script src="{% static 'js/add-review.js' %}"></script>
