{% extends "account/base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Change Password" %}{% endblock %}

{% block inner_content %}
    <h1 class="logo-font text-h2 text-uppercase mb-4">{% trans "Change Password" %}</h1>

    <form method="POST" action="{% url 'account_change_password' %}" class="password_change">
        {% csrf_token %}
        {{ form|crispy }}
        <a class="btn-milky btn rounded-pill" href="{% url 'account_login' %}">Back to Login</a>
        <button type="submit" name="action" class="btn-milky btn rounded-pill">{% trans "Change Password" %}</button>
    </form>
{% endblock %}
