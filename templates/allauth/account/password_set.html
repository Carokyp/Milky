{% extends "account/base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Set Password" %}{% endblock %}

{% block inner_content %}

<div class="p-4">
    <h1 class="logo-font text-h2 text-uppercase mb-1">{% trans "Set Password" %}</h1>
    <p class="text-muted text-sm mb-4">{% trans "Choose a password for your account." %}</p>

    <form method="POST" action="{% url 'account_set_password' %}" class="password_set">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="row justify-content-center">
            <div class="col-12 col-md-4">
                <input type="submit" name="action" value="{% trans 'Set Password' %}" class="btn-milky-gold btn rounded-pill py-2 text-uppercase w-100 fw-bold mt-2"/>
            </div>
        </div>
    </form>
</div>

{% endblock %}
