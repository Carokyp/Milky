{% extends "account/base.html" %}

{% load i18n %}
{% block head_title %}{% trans "Change Password" %}{% endblock %}

{% block inner_content %}

<div class="p-4">
    <div class="text-center mb-4">
        <i class="fa-solid fa-circle-check fa-3x mb-3 text-light-brown"></i>
        <h1 class="logo-font text-h2 text-uppercase mb-1">{% trans "Change Password" %}</h1>
        <p class="text-muted text-sm">{% trans "Your password is now changed." %}</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-md-4">
            <a class="btn-milky btn rounded-pill py-2 text-uppercase w-100 fw-bold text-center d-block" href="{% url 'account_login' %}">{% trans "Back to Login" %}</a>
        </div>
    </div>
</div>

{% endblock %}
