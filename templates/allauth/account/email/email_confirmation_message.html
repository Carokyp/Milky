{% load account %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milky - Confirm Your Email</title>
<style>
{% comment %}
Same shared stylesheet as the order confirmation and gift emails — see
templates/emails/_email_styles.css and milky/adapter.py for why this has to
be included rather than linked.
{% endcomment %}
{% include "emails/_email_styles.css" %}
</style>
</head>
<body>
<!-- Outer table: full-width page background behind the card, since some
     mail clients ignore styles on <body> itself -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="email-bg">
<tr>
<td align="center" class="email-pad">

    <table role="presentation" class="email-wrapper card" width="600" cellpadding="0" cellspacing="0">

        <!-- Header / logo text -->
        <tr>
            <td align="center" class="bg-brown header">
                <span class="logo-font text-cream text-uppercase logo-text">Confirm Your Email</span>
            </td>
        </tr>

        <!-- Greeting -->
        <tr>
            <td class="greeting text-center">
                {% user_display user as user_display %}
                <h1 class="logo-font text-brown no-margin">Hello, {{ user_display }}!</h1>
                <p class="text-muted greeting-text">Please confirm your email address to activate your Milky account.</p>
            </td>
        </tr>

        <!-- Confirmation button -->
        <tr>
            <td class="cta-section text-center">
                <a href="{{ activate_url }}" class="cta-button">Confirm Email</a>
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td align="center" class="bg-brown-light footer">
                <p class="text-cream text-sm no-margin">Thank you for choosing Milky!</p>
            </td>
        </tr>

    </table>

</td>
</tr>
</table>
</body>
</html>
