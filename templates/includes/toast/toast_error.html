{% load static %}

<div class="toast site-toast rounded-4 overflow-hidden" role="alert" aria-live="assertive" aria-atomic="true">
  <div class="toast-header site-toast-header site-toast-header--error border-0 py-3 px-3">
    <i class="fa-solid fa-circle-xmark me-2"></i>
    <strong class="me-auto text-uppercase">Error</strong>
    <button type="button" class="btn-close btn-close-white ms-2" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
  <div class="toast-body site-toast-body px-3 py-3">
    {{ message }}
  </div>
</div>
