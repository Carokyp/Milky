{% load static %}

<div class="toast bg-success" role="alert" aria-live="assertive" aria-atomic="true">
  <div class="toast-header">
    <img src="{% static 'images/checked.png' %}" class="rounded me-2" alt="Success Icon" width="20" height="20">
    <strong class="me-auto">Success</strong>
    <button type="button" class="btn-close btn-close-black" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
  <div class="toast-body bg-white">
    {{message}}
  </div>
</div>
