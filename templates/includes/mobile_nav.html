<!-- Account dropdown -->
<div class="dropdown">
    <a href="#" class="mobile-nav-icon" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="fa-regular fa-circle-user fa-lg"></i>
    </a>
    <ul class="dropdown-menu dropdown-menu-end">
        {% if request.user.is_authenticated %}
        {% if request.user.is_superuser %}
        <li><a href="{% url 'add_product' %}" class="dropdown-item">Products Management</a></li>
        {% endif %}
        <li><a class="dropdown-item" href="{% url 'profile' %}">My Profile</a></li>
        <li><a class="dropdown-item" href="{% url 'account_logout' %}">Sign Out</a></li>
        {% else %}
        <li><a class="dropdown-item" href="{% url 'account_signup' %}">Sign Up</a></li>
        <li><a class="dropdown-item" href="{% url 'account_login' %}">Sign In</a></li>
        {% endif %}
    </ul>
</div>

<!-- Cart -->
<a href="{% url 'view_cart' %}" class="mobile-nav-icon nav-link position-relative">
    <i class="fa-solid fa-cart-shopping fa-lg"></i>
    {% if product_count > 0 %}
    <span class="position-absolute top-0 translate-middle badge cart-badge rounded-pill">
        {{ product_count }}
    </span>
    {% endif %}
</a>

<!-- Burger button -->
<button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
</button>
